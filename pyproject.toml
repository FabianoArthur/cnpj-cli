[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "cnpj-etl"
version = "1.0.0"
description = "Download and load Brazil's open CNPJ company registry (Receita Federal) into SQLite or PostgreSQL."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Fabiano Arthur" }]
keywords = ["cnpj", "receita-federal", "open-data", "etl", "postgresql", "sqlite", "brazil"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Database",
]
dependencies = [
    "requests>=2.31",
    "tqdm>=4.66",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
dev = [
    "pytest>=8",
    "ruff==0.16.9",
    "build>=1.2",
]

[project.scripts]
cnpj = "cnpj_etl.cli:main"

[project.urls]
Homepage = "https://github.com/FabianoArthur/cnpj-cli"
Issues = "https://github.com/FabianoArthur/cnpj-cli/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/cnpj_etl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["src"]
markers = ["postgres: needs a real PostgreSQL (set CNPJ_TEST_DSN)"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S"]
ignore = ["S101", "S608"]

[tool.ruff.lint.isort]
known-first-party = ["cnpj_etl"]
known-local-folder = ["fakedump", "fakeshare"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]
"scripts/*" = ["S"]
