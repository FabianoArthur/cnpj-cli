<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 572" width="880" height="572" role="img" aria-labelledby="title desc" lang="en">
<title id="title">How cnpj-etl works</title>
<desc id="desc">cnpj download fetches each monthly snapshot from the Receita Federal open data share, with retries, backoff, resumable ranges and at most four parallel downloads, into one folder per month. The archive is extracted safely: tar.gz or zip, inner zips, latin-1 CSV files. cnpj sqlite loads one month into a SQLite file that cnpj lookup queries, printing JSON, CSV or a table. cnpj postgres replaces a PostgreSQL snapshot in one transaction, and cnpj bulk-load appends every month with a competencia column, one transaction per month.</desc>
<style>
text{font-family:ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;fill:#e6edf3}
.b{font-size:14px;font-weight:600}
.h{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.m{font-size:12.5px;fill:#9198a1}
.code{font-family:ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;font-size:13.5px;font-weight:600;fill:#79c0ff}
.bg{fill:#0d1117;stroke:#30363d}
.card{fill:#161b22;stroke:#30363d}
.src{fill:#161b2e;stroke:#2f3a6b}
.srct{fill:#a5b4fc}
.disk{fill:#1c2128;stroke:#30363d;stroke-dasharray:5 4}
.e{fill:none;stroke:#6e7681;stroke-width:1.5;stroke-linejoin:round}
.dot{fill:#f0883e}
.halo{fill:#f0883e;opacity:.25}
.hl{fill:none;stroke:#f0883e;stroke-width:2;stroke-linejoin:round}
@media (prefers-reduced-motion:reduce){.pk,.hl{display:none}}
</style>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#6e7681"/></marker></defs>
<rect x="0.5" y="0.5" width="879" height="571" rx="16" class="bg"/>
<rect x="24" y="46" width="220" height="92" rx="10" class="src"/>
<text x="134.0" y="77.0" class="b srct" text-anchor="middle">Receita Federal</text>
<text x="134.0" y="97.0" class="m" text-anchor="middle">open data share</text>
<text x="134.0" y="117.0" class="m" text-anchor="middle">one archive per month</text>
<text x="277" y="84" class="m" text-anchor="middle">HTTPS</text>
<rect x="310" y="46" width="240" height="92" rx="10" class="card"/>
<text x="430.0" y="77.0" class="code" text-anchor="middle">cnpj download</text>
<text x="430.0" y="97.0" class="m" text-anchor="middle">retry · backoff · resume</text>
<text x="430.0" y="117.0" class="m" text-anchor="middle">≤ 4 in parallel</text>
<rect x="616" y="46" width="240" height="92" rx="10" class="disk"/>
<text x="736.0" y="77.0" class="code" text-anchor="middle">data/YYYY-MM/</text>
<text x="736.0" y="97.0" class="m" text-anchor="middle">dados.tar.gz</text>
<text x="736.0" y="117.0" class="m" text-anchor="middle">atomic rename, resumable</text>
<rect x="300" y="202" width="280" height="80" rx="10" class="card"/>
<text x="440.0" y="227.0" class="b" text-anchor="middle">safe extraction</text>
<text x="440.0" y="247.0" class="m" text-anchor="middle">tar.gz or zip → inner zips</text>
<text x="440.0" y="267.0" class="m" text-anchor="middle">→ latin-1 CSV, no traversal</text>
<rect x="24" y="346" width="250" height="90" rx="10" class="card"/>
<text x="149.0" y="376.0" class="code" text-anchor="middle">cnpj sqlite</text>
<text x="149.0" y="396.0" class="m" text-anchor="middle">one month</text>
<text x="149.0" y="416.0" class="m" text-anchor="middle">→ cnpj_YYYY_MM.db</text>
<rect x="315" y="346" width="250" height="90" rx="10" class="card"/>
<text x="440.0" y="376.0" class="code" text-anchor="middle">cnpj postgres</text>
<text x="440.0" y="396.0" class="m" text-anchor="middle">one month, replaces</text>
<text x="440.0" y="416.0" class="m" text-anchor="middle">the snapshot atomically</text>
<rect x="606" y="346" width="250" height="90" rx="10" class="card"/>
<text x="731.0" y="376.0" class="code" text-anchor="middle">cnpj bulk-load</text>
<text x="731.0" y="396.0" class="m" text-anchor="middle">every month, with history</text>
<text x="731.0" y="416.0" class="m" text-anchor="middle">one transaction per month</text>
<rect x="24" y="470" width="250" height="62" rx="10" class="card"/>
<text x="149.0" y="496.0" class="code" text-anchor="middle">cnpj lookup</text>
<text x="149.0" y="516.0" class="m" text-anchor="middle">JSON · CSV · table</text>
<rect x="315" y="470" width="541" height="62" rx="10" class="card"/>
<text x="585.5" y="496.0" class="b" text-anchor="middle">PostgreSQL</text>
<text x="585.5" y="516.0" class="m" text-anchor="middle">schema cnpj · COPY FROM STDIN · indexes · ANALYZE</text>
